[phases.setup]
nixPkgs = ["python311", "chromium", "nss", "nspr", "atk", "cups", "dbus", "expat", "libdrm", "libxcb", "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr", "xorg.libxcb", "mesa", "alsa-lib", "xorg.libxshmfence", "pango", "cairo"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium"
]

[start]
cmd = "python main.py"
